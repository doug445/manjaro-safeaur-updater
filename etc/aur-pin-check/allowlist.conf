# aur-pin-check allowlist — escape hatch for AUR packages whose PKGBUILD
# uses tag-pinned (rather than commit-pinned) VCS sources.
#
# Format: <pkg>  <vcs-source-spec>  <expected-40-hex-sha>
#   - pkg:    AUR package name (matches the .SRCINFO `pkgbase`)
#   - spec:   exact source line from .SRCINFO (after any "name::" prefix)
#   - sha:    commit SHA the upstream tag should resolve to
#
# When pin-check sees this rule, it does `git ls-remote --tags <url>` and
# accepts only if the tag *still* resolves to <expected-sha>. If upstream
# silently moves the tag, the SHA changes and the package is rejected.
#
# How to add a new entry:
#   1. yupdate fails with "[pin-check] REJECT <pkg>: ... unpinned VCS source(s)"
#   2. Inspect the upstream commit at the tag. If you trust it:
#        git ls-remote --tags <repo-url> refs/tags/<tag>
#   3. Add a row here with the resolved SHA.

